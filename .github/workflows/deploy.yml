name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - name: Copy aitool HTML files to dist/aitool
        run: |
          mkdir -p dist/aitool
          cp kira.html nova.html leo.html plan.html video.html landing.html reel12.html dist/aitool/ 2>/dev/null || true
          cp -r aitool/* dist/aitool/ 2>/dev/null || true
          echo "Files copied to dist/aitool:"
          ls -R dist/aitool/
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4