    :root {
      --bg:#0d0d0d; --surface:#181818; --s2:#222; --border:#2c2c2c;
      --text:#e8e8e8; --muted:#777; --dim:#999;
      --a:#3b82f6; --a-dim:rgba(59,130,246,.12); --a-glow:rgba(59,130,246,.25);

    html,body{height:100%}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);

    /* ── HEADER ── */

    .av-ring{position:absolute;inset:-4px;border-radius:14px;
      border:2px solid var(--a);opacity:0;transition:opacity .3s}
    .av-ring.on{opacity:1;animation:rp 1.6s ease-in-out infinite}
    @keyframes rp{0%,100%{box-shadow:0 0 0 0 var(--a-glow)}50%{box-shadow:0 0 0 7px transparent}}
    .hd-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
    .badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;
      background:var(--a-dim);color:var(--a);border:1px solid rgba(59,130,246,.25);
      letter-spacing:.5px;text-transform:uppercase}
    .hd-sub{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:2px}
    .dot-live{width:6px;height:6px;border-radius:50%;background:var(--g);
      animation:blink 2.2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* Mode badge */
    .mode-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;
      border:1px solid var(--border);background:var(--s2);
      font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
    .mode-badge.on{border-color:rgba(34,197,94,.3);background:var(--g-dim);color:var(--g)}
    .mode-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .mode-badge.on .mode-dot{background:var(--g)}
    .hr{display:flex;align-items:center;gap:8px}
    .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);

      cursor:pointer;font-size:13px;transition:all .2s}
    .icon-btn:hover{background:var(--s2);color:var(--text)}

    /* ── PROGRESS ── */
    .pt{height:2px;background:var(--border);flex-shrink:0}
    .pf{height:100%;background:linear-gradient(90deg,var(--a),#6366f1);

    #chat{flex:1;overflow-y:auto;padding:28px 16px 0;scroll-behavior:smooth}
    #chat::-webkit-scrollbar{width:4px}
    #chat::-webkit-scrollbar-thumb{background:#333;border-radius:999px}

    .msg.user{flex-direction:row-reverse}

// ══════════════════════════════════════════════════════════
//  CHUNK TYPEWRITER
// ══════════════════════════════════════════════════════════
function chunk(el, html, n = 3, ms = 16) {
  return new Promise(res => {
    el.innerHTML = '';
    const tokens = [];
    const re = /(<[^>]+>|&[^;]+;|[\s\S])/g;
    let m;
    while ((m = re.exec(html)) !== null) tokens.push(m[0]);
    let i = 0;
    const CUR = '<span class="cur"></span>';
    function tick() {
      if (i >= tokens.length) { el.innerHTML = html; res(); return; }
      let added = 0;
      while (i < tokens.length && added < n) {
        i++;
        if (!tokens[i - 1].startsWith('<')) added++;
      }
      el.innerHTML = tokens.slice(0, i).join('') + CUR;
      scrollB();
      const last = tokens[i - 1] || '';
      const delay = last === '.' || last === '!' || last === '?' ? 120 : last === ',' ? 60 : ms;
      setTimeout(tick, delay);
    }
    tick();
  });
}

      name: 'HRR — Hook · Retain · Reward',
      code: 'HRR',
      desc: 'Với kênh giải trí/viral, tỷ lệ giữ chân là vua. HRR tạo tò mò ngay giây đầu → giữ chân bằng nhịp điệu → thưởng bằng kết quả bất ngờ ở cuối video.'
    };
  }
}

// ══════════════════════════════════════════════════════════
//  FLOW
// ══════════════════════════════════════════════════════════
async function askQ(n) {
  const label = n === 0 ? 'Bước 1 / 2' : 'Bước 2 / 2';
  await novaSay(`<span class="qlabel">${label}</span>${Q[n].q}`);
  tags(Q[n].h); setIn(true); uin.focus();
}

async function send() {
  const val = uin.value.trim();
  if (!val || busy || step > 2) return;

  userSay(val);
  uin.value = '';
  clearTags();
  setIn(false);

  const s = step; step++;
  setP(step, 3);

  const thinkDelay = 700 + Math.min(val.length * 12, 1400) + Math.random() * 300;
  const tid = showThink(THK[s]);
  active(true);

  // Step 0: detect framework + get hints for step 1 concurrently
  let dynHints = null;
  if (s === 0) {
    const fw = detectFramework(val);
    userData.industry = val;
    userData.framework = fw.name;
    userData.frameworkReason = fw.desc;
    userData.fwCode = fw.code;

    // Fetch dynamic hints while waiting
    const hintWindow = Math.max(thinkDelay, 800) + 600;
    const [, hints] = await Promise.all([
      sleep(thinkDelay),
      AI.mode !== 'fallback'
        ? Promise.race([
            AI.hints(val, 1).catch(() => null),
            sleep(hintWindow).then(() => null)
          ])
        : Promise.resolve(null)
    ]);
    dynHints = hints;

    rm(tid); active(false);

    // Show AI reaction
    const row = mkRow('nova');
    const txt = row.querySelector('.txt');
    cw.appendChild(row); active(true);

    if (AI.mode !== 'fallback') {
      try { await AI.stream(s, val, txt); }
      catch (e) { txt.textContent = FR[s]?.(val) || ''; }
    } else {
      txt.textContent = FR[s]?.(val) || '';
    }
    active(false);

    // Show framework card
    await sleep(300);
    await novaSay(
      `Với ngành hàng này, framework marketing xương sống được chọn là:<br><br>` +
      `<div class="fw-card">` +
      `<div class="fw-title"><i class="fas fa-chart-network"></i> Framework</div>` +
      `<div class="fw-name">${fw.name}</div>` +
      `<div class="fw-desc">${fw.desc}</div>` +
      `</div>`
    );

    await sleep(350);
    await askQ(1);
    tags(dynHints || Q[1].h);
    setIn(true); uin.focus();

  } else if (s === 1) {
    userData.painPoint = val;

    await sleep(thinkDelay);
    rm(tid); active(false);

    // AI reaction
    const row = mkRow('nova');
    const txt = row.querySelector('.txt');
    cw.appendChild(row); active(true);

    if (AI.mode !== 'fallback') {
      try { await AI.stream(s, val, txt); }
      catch (e) { txt.textContent = FR[s]?.(val) || ''; }
    } else {
      txt.textContent = FR[s]?.(val) || '';
    }
    active(false);

    await sleep(500);
    const tid2 = showThink(THK[2]);
    active(true);
    await sleep(1800);
    rm(tid2); active(false);

    await genPrompt();
  }
}

// ══════════════════════════════════════════════════════════
//  GENERATION
// ══════════════════════════════════════════════════════════
async function genPrompt() {
  setP(3, 3);

  await novaSay(
    `<span class="hg"><i class="fas fa-check-circle"></i> Dữ liệu đã đầy đủ!</span><br><br>` +
    `<span style="color:var(--muted);font-size:12.5px">Mega Prompt đã được đóng gói với framework <strong style="color:var(--a)">${userData.fwCode}</strong> và insight về rào cản tâm lý của khách hàng. Copy và paste vào ChatGPT/Claude để bắt đầu:</span>`
  );

  const prompt = buildPrompt();

  const pid = 'pr' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg';
  row.innerHTML = `
    <div class="mav nova" style="background:linear-gradient(135deg,#22c55e,#0d9488)"><i class="fas fa-code" style="font-size:10px"></i></div>
    <div class="bubble" style="max-width:100%;border-color:#22c55e22">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Copy và paste vào <strong style="color:var(--text)">ChatGPT / Claude / Gemini</strong>:</div>
      <div class="pbox" id="${pid}"><button class="cpbtn" onclick="copyP('${pid}')"><i class="fas fa-copy"></i> Copy</button>${esc(prompt)}</div>
      <div class="btn-row">
        <button class="open-ai-btn chatgpt" onclick="copyAndOpen('${pid}')">
          <i class="fas fa-robot" style="font-size:12px"></i> ChatGPT
        </button>
        <button class="open-ai-btn gemini" onclick="copyAndOpenGemini('${pid}')">
          <i class="fas fa-gem" style="font-size:12px"></i> Gemini
        </button>
      </div>
    </div>`;
  cw.appendChild(row);

  clearTags();
  uin.disabled = true; uin.placeholder = '✓ Mega Prompt đã sẵn sàng'; sbtn.disabled = true;

  const rb = document.createElement('button');
  rb.className = 'qt';
  rb.innerHTML = '<i class="fas fa-redo" style="margin-right:6px;font-size:10px"></i>Thiết lập lại';
  rb.onclick = () => location.reload();
  qtags.appendChild(rb);
  scrollB();
}

// ══════════════════════════════════════════════════════════
//  PROMPT BUILDER (Nova logic — giống bản gốc)
// ══════════════════════════════════════════════════════════
function buildPrompt() {
  const d = userData;
  return `Hãy đóng vai trò là một Giám đốc Chiến lược Nội dung (Senior Content Strategist) và Copywriter thực chiến. Nhiệm vụ của bạn là đồng hành tư vấn 1-1 để giúp tôi tạo ra kịch bản video dọc (Tiktok/Reels) tối ưu chuyển đổi, thời lượng STRICTLY dưới 75 giây (tối đa 210 từ).

BỐI CẢNH DỰ ÁN CỦA TÔI:
- Ngành hàng / Sản phẩm: ${d.industry}
- Rào cản / Nỗi đau lớn nhất của khách hàng: "${d.painPoint}"
- Công thức Marketing xương sống: ${d.framework}

CHIẾN LƯỢC SẢN XUẤT CÔNG NGHIỆP (3 MODULE):
Video sẽ được cấu trúc thành 3 phần tách biệt để tôi tối ưu thời gian quay dựng:
- Phần 1 (Hook - 15-20s): Thay đổi linh hoạt theo từng video để test A/B thị trường.
- Phần 2 (Body - 40s): LÕI CỐ ĐỊNH. Áp dụng chuẩn công thức [${d.fwCode}]. Phần này mang thông điệp chính, tôi SẼ CHỈ QUAY 1 LẦN để ghép vào giữa mọi video.
- Phần 3 (CTA - 10s): Thay đổi linh hoạt sao cho nối mượt với Hook.

QUY TẮC LÀM VIỆC CỦA BẠN (BẮT BUỘC):
1. KHÔNG BAO GIỜ tự ý nhả toàn bộ kịch bản ra trong 1 lần trả lời. Phải làm việc theo TỪNG BƯỚC HỎI ĐÁP bên dưới. Đợi tôi trả lời xong bước này mới được qua bước sau.
2. Ngôn ngữ giao tiếp điềm đạm, thực tế, đúng chất chuyên gia. Tuyệt đối không dùng những từ ngữ sáo rỗng, viễn tưởng.
3. Kịch bản xuất ra phải là "văn nói" tự nhiên, có nhịp điệu, động từ mạnh.

QUY TRÌNH THỰC HIỆN TỪNG BƯỚC:

BƯỚC 1 (Tạo Body cố định): Đặt cho tôi 1 hoặc 2 câu hỏi làm rõ về Ưu điểm nổi bật (USP) của sản phẩm tôi đang bán. Sau khi tôi cung cấp, hãy viết phần Lõi Body (khoảng 90-100 từ) áp dụng đúng cấu trúc ${d.framework}. (Chờ tôi duyệt hoặc sửa).

BƯỚC 2 (Đề xuất Hook): Dựa vào Insight và Body đã chốt, hãy đưa ra 4 phương án Hook khác nhau (~40-50 từ/Hook). Phân loại rõ 4 hướng tiếp cận: (1) Đâm thẳng vào nỗi đau, (2) Lật ngược định kiến, (3) Bằng chứng thực tế, (4) Storytelling. (Yêu cầu tôi chọn 1 số).

BƯỚC 3 (Đề xuất CTA): Dựa vào Hook tôi đã chọn, đề xuất 3 câu CTA (~25 từ) nối mượt mà từ Body sang chốt sale. (Yêu cầu tôi chọn).

BƯỚC 4 (Lắp ráp & Tối ưu): Ghép [Hook] + [Body] + [CTA]. Chuốt lại các từ nối. BẮT BUỘC: Đếm chính xác tổng số từ, đảm bảo tuyệt đối dưới 210 từ.

Nếu bạn đã hiểu quy trình chuyên nghiệp này, hãy xác nhận ngắn gọn và bắt đầu ngay BƯỚC 1 bằng cách hỏi tôi về USP của sản phẩm!`;
}

// ══════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function now() { const d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') }
function rm(id) { document.getElementById(id)?.remove() }
function scrollB() { const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight }
function active(on) { ring.classList.toggle('on', on) }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }
function setIn(on) { uin.disabled = !on; sbtn.disabled = !on; uin.placeholder = on ? 'Nhập câu trả lời của bạn...' : 'Nova đang xử lý...' }
function setP(cur, tot) { prog.style.width = ((cur / tot) * 100) + '%' }
function tags(h) {
  qtags.innerHTML = '';
  (h || []).forEach(t => {
    const b = document.createElement('button');
    b.className = 'qt'; b.textContent = t;
    b.onclick = () => { uin.value = t; send(); };
    qtags.appendChild(b);
  });
}
function clearTags() { qtags.innerHTML = '' }
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
function copyP(id) {
  const el = document.getElementById(id);
  const btn = el.querySelector('.cpbtn'); btn.style.display = 'none';
  const text = el.innerText.trim(); btn.style.display = '';
  (navigator.clipboard?.writeText(text) ?? Promise.reject()).catch(() => {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  });
  toast('<i class="fas fa-check-circle"></i> Đã sao chép Mega Prompt!');
}
function copyAndOpen(id) {
  copyP(id);
  window.open('https://chatgpt.com', '_blank');
}
function copyAndOpenGemini(id) {
  copyP(id);
  window.open('https://gemini.google.com', '_blank');
}

    `Nhiệm vụ của tôi là giúp bạn thiết lập một quy trình sản xuất video dưới 75 giây được bóc tách làm <span class="h">3 module</span>: <strong>Hook linh hoạt — Body cố định — CTA linh hoạt</strong>.<br><br>` +
